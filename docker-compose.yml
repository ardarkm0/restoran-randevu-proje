services:
  # PHP + Apache Web Sunucusu
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumina_app
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_USER=lumina_user
      - DB_PASS=lumina_pass
      - DB_NAME=lumina_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    networks:
      - lumina_network
    restart: unless-stopped

  # MySQL Veritabanı
  db:
    image: mysql:8.0
    container_name: lumina_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: lumina_db
      MYSQL_USER: lumina_user
      MYSQL_PASSWORD: lumina_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./lumina.sql:/docker-entrypoint-initdb.d/lumina.sql
    networks:
      - lumina_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # phpMyAdmin (opsiyonel - geliştirme kolaylığı için)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: lumina_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: lumina_user
      PMA_PASSWORD: lumina_pass
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lumina_network
    restart: unless-stopped

volumes:
  db_data:
    driver: local

networks:
  lumina_network:
    driver: bridge
