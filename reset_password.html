<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina | Enter Reset Code</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{--gold:#d4af37;--gold-dim:rgba(212,175,55,0.12);--dark:#0a0a0a;--text:#f0ede8;--muted:#777;--border:rgba(212,175,55,0.2);}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Poppins',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
        body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 60% at 70% 50%,rgba(212,175,55,0.06),transparent);pointer-events:none;}
        .card{width:100%;max-width:420px;background:#111;border:1px solid var(--border);border-radius:20px;padding:44px 40px;position:relative;}
        .back{position:absolute;top:20px;left:20px;display:flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:12px;transition:.3s;}
        .back:hover{color:var(--gold);}
        .card-icon{width:64px;height:64px;background:var(--gold-dim);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 24px;}
        h1{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;text-align:center;margin-bottom:8px;}
        .sub{font-size:13px;color:var(--muted);text-align:center;line-height:1.7;margin-bottom:28px;}
        .email-highlight{color:var(--gold);font-weight:500;}
        .alert{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:20px;text-align:center;display:none;}
        .alert.show{display:block;}
        .alert-err{background:rgba(220,60,60,0.1);border:1px solid rgba(220,60,60,0.3);color:#ff8080;}
        .alert-ok{background:rgba(60,200,100,0.1);border:1px solid rgba(60,200,100,0.3);color:#6ee89a;}
        label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#555;margin-bottom:8px;font-weight:500;}
        .inp-wrap{position:relative;margin-bottom:16px;}
        .inp-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#444;pointer-events:none;}
        .inp-wrap:focus-within svg{color:var(--gold);}
        input{width:100%;padding:13px 14px 13px 44px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:var(--text);font-family:'Poppins',sans-serif;font-size:14px;outline:none;transition:.3s;}
        input[name="code"]{padding:13px 14px;text-align:center;font-size:24px;letter-spacing:10px;font-weight:600;color:var(--gold);}
        input:focus{border-color:var(--gold);background:rgba(212,175,55,0.05);}
        input::placeholder{color:#333;letter-spacing:4px;font-size:16px;}
        .btn{width:100%;padding:15px;background:linear-gradient(135deg,var(--gold),#c9a227);color:#000;border:none;border-radius:10px;font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:.3s;margin-top:8px;}
        .btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(212,175,55,0.35);}
        .toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#555;cursor:pointer;padding:4px;display:flex;align-items:center;}
        .toggle-pw:hover{color:var(--gold);}
    </style>
</head>
<body>
    <!-- Global Theme Toggle Button -->
    <button class="global-theme-toggle" id="globalThemeToggle" aria-label="Toggle Theme" style="position: absolute; top: 20px; right: 20px; background: var(--dark); border: 1px solid var(--border); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; z-index: 9999; transition: 0.3s;">
        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
<div class="card">
    <a href="forgot_password.html" class="back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Back
    </a>

    <div class="card-icon">📬</div>
    <h1>Enter Code</h1>
    <p class="sub">We sent a 6-digit code to<br><span class="email-highlight" id="emailDisplay">your email</span><br>Valid for 15 minutes.</p>

    <div class="alert alert-ok show" id="alertSent">Code sent! Check your inbox.</div>
    <div class="alert alert-err" id="alertInvalid">Invalid or expired code. Please try again.</div>
    <div class="alert alert-err" id="alertEmpty">Please fill in all fields.</div>
    <div class="alert alert-err" id="alertShort">Password must be at least 6 characters.</div>

    <form action="reset_password.php" method="POST">
        <input type="hidden" name="email" id="emailInput" value="">

        <label>6-Digit Code</label>
        <div class="inp-wrap" style="margin-bottom:16px;">
            <input type="text" name="code" maxlength="6" placeholder="000000" required inputmode="numeric" pattern="\d{6}">
        </div>

        <label for="rp-pw">New Password</label>
        <div class="inp-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="rp-pw" name="password" placeholder="New password" required minlength="6">
            <button type="button" class="toggle-pw" onclick="var i=document.getElementById('rp-pw');i.type=i.type==='password'?'text':'password'">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
        </div>

        <button type="submit" class="btn">Reset Password</button>
    </form>
</div>

<script>
    const p = new URLSearchParams(window.location.search);
    const email = decodeURIComponent(p.get('email') || '');

    // Set email in form and display
    document.getElementById('emailInput').value  = email;
    document.getElementById('emailDisplay').textContent = email || 'your email';

    // Show error states
    const err = p.get('error');
    if (!p.get('sent'))         document.getElementById('alertSent').classList.remove('show');
    if (err === 'invalid')      document.getElementById('alertInvalid').classList.add('show');
    if (err === 'empty')        document.getElementById('alertEmpty').classList.add('show');
    if (err === 'short')        document.getElementById('alertShort').classList.add('show');

    // Global Theme Toggle
    document.addEventListener('DOMContentLoaded', () => {
        const tBtn = document.getElementById('globalThemeToggle');
        const sun = tBtn.querySelector('.sun-icon');
        const moon = tBtn.querySelector('.moon-icon');
        
        function setLight() {
            document.body.style.setProperty('--dark', '#fcfbf9');
            document.body.style.setProperty('--text', '#1a1a1a');
            document.body.style.setProperty('--border', 'rgba(212,175,55,0.4)');
            document.querySelector('.card').style.background = '#fff';
            document.querySelectorAll('input').forEach(i => { i.style.background='#fff'; i.style.color='#000'; });
            sun.style.display = 'block';
            moon.style.display = 'none';
        }
        function setDark() {
            document.body.style.setProperty('--dark', '#0a0a0a');
            document.body.style.setProperty('--text', '#f0ede8');
            document.body.style.setProperty('--border', 'rgba(212,175,55,0.2)');
            document.querySelector('.card').style.background = '#111';
            document.querySelectorAll('input').forEach(i => { i.style.background='rgba(255,255,255,0.04)'; i.style.color='#fff'; });
            sun.style.display = 'none';
            moon.style.display = 'block';
        }

        if(localStorage.getItem('lumina_theme') === 'light') setLight();

        tBtn.addEventListener('click', () => {
            if(localStorage.getItem('lumina_theme') !== 'light') {
                localStorage.setItem('lumina_theme', 'light');
                setLight();
            } else {
                localStorage.setItem('lumina_theme', 'dark');
                setDark();
            }
        });
    });
</script>
</body>
</html>
