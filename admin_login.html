<head>

</head>
<body>
    <!-- Global Theme Toggle Button -->
    <button class="global-theme-toggle" id="globalThemeToggle" aria-label="Toggle Theme" style="position: absolute; top: 20px; right: 20px; background: #111; border: 1px solid rgba(212,175,55,0.2); color: #f0ede8; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; z-index: 9999; transition: 0.3s;">
        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
      <div class="admin-wrapper">

        
        <div class="admin-brand">
            <div class="brand-top">
                <div class="admin-logo">Lumina<span>.</span></div>
                <div class="admin-badge">Staff Portal</div>
            </div>
            <div class="brand-center">
                <div class="shield-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                </div>
                <h2>Management Access</h2>
                <p>This portal is restricted to authorized Lumina staff members only.</p>
            </div>
            <div class="brand-bottom">
                <a href="home.php" class="guest-link">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    Back to Home
                </a>
            </div>
        </div>

        
        <div class="admin-form-side">
            <div class="admin-form-box">
                <div class="admin-form-header">
                    <div class="admin-tag">Administrator</div>
                    <h1>Staff Sign In</h1>
                    <p>Enter your credentials to access the management dashboard</p>
                </div>

                <div class="alert-error" id="alertError" style="display:none"></div>

                <form action="admin_login.php" method="POST">
                    <div class="input-group">
                        <label for="admin-username">Username</label>
                        <div class="input-wrap">
                            <svg class="inp-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            <input type="text" id="admin-username" name="username" placeholder="admin" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="admin-password">Password</label>
                        <div class="input-wrap">
                            <svg class="inp-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            <input type="password" id="admin-password" name="password" placeholder="••••••••" required>
                            <button type="button" class="toggle-pw" onclick="togglePw()">
                                <svg id="pwIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="admin-submit" name="admin_login">
                        <span>Access Dashboard</span>
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                </form>

                <div class="security-note">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    Secure connection · Unauthorized access is prohibited
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePw() {
            const inp = document.getElementById('admin-password');
            inp.type = inp.type === 'password' ? 'text' : 'password';
            document.querySelector('.toggle-pw').style.color = inp.type === 'text' ? '#d4af37' : '';
        }

        // Show error from URL param
        const p = new URLSearchParams(window.location.search);
        const err = p.get('error');
        if (err) {
            const msgs = { invalid: 'Invalid email or password.', empty: 'Please fill in all fields.' };
            const el = document.getElementById('alertError');
            el.textContent = msgs[err] || 'An error occurred.';
            el.style.display = 'block';
        }

        // Global Theme Toggle
        document.addEventListener('DOMContentLoaded', () => {
            const tBtn = document.getElementById('globalThemeToggle');
            const sun = tBtn.querySelector('.sun-icon');
            const moon = tBtn.querySelector('.moon-icon');
            
            function applyTheme(isLight) {
                if (isLight) {
                    document.body.classList.add('light-mode');
                    sun.style.display = 'block';
                    moon.style.display = 'none';
                } else {
                    document.body.classList.remove('light-mode');
                    sun.style.display = 'none';
                    moon.style.display = 'block';
                }
            }

            if(localStorage.getItem('lumina_theme') === 'light') applyTheme(true);

            tBtn.addEventListener('click', () => {
                const isLight = !document.body.classList.contains('light-mode');
                applyTheme(isLight);
                localStorage.setItem('lumina_theme', isLight ? 'light' : 'dark');
            });
        });
    </script>
</body>
</html>
